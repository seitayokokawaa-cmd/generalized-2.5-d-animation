[project]
name = "motionforge"
version = "0.1.0"
description = "Deterministic 2.5D animation studio: screenplay in, finished MP4 film out"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "cairocffi>=1.6",
    "imageio-ffmpeg>=0.4.9",
    "uharfbuzz>=0.39",
    "freetype-py>=2.4",
]

[project.scripts]
motionforge = "motionforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motionforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
