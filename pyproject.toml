[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionforge"
version = "0.1.0"
description = "MotionForge: a deterministic 2.5D animation studio that turns a written screenplay into a finished MP4 film."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MotionForge" }]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "imageio-ffmpeg>=0.4.9",
    "fonttools>=4.40",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
motionforge = "motionforge.cli:main"

[tool.setuptools.packages.find]
include = ["motionforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
